# Local MySQL 8.4 for rblog: `docker compose up -d --wait`.
# rustcms requires utf8mb4 / utf8mb4_0900_bin, InnoDB and a strict sql_mode (MySQL 8.4's default).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rblog
      MYSQL_USER: rblog
      MYSQL_PASSWORD: rblog
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_bin"
    ports:
      - "${RBLOG_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  mysql-data:
