# Checks every push and pull request, in two parallel jobs: lint (fmt, clippy) and the
# tests on MySQL 8.4 (RBlog's only database). `Cargo.lock` is committed: CI builds exactly
# the versions you tested.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing is rebuilt incrementally in CI; debug info only slows builds and caches down.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: lint }
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Started first and in the background (pull included): it gets ready while Rust builds.
      # Services cannot take server flags. In memory and never fsynced, like mysql-test.
      - name: Start MySQL 8.4
        run: |
          nohup docker run -d --name mysql -p 3307:3306 -e MYSQL_ROOT_PASSWORD=root --tmpfs /var/lib/mysql mysql:8.4 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_bin \
            --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=OFF --innodb-flush-method=nosync \
            --sync-binlog=0 --skip-log-bin >/tmp/mysql-start.log 2>&1 &
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: test }
      - run: cargo nextest run --locked --no-run
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 120); do docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null && exit 0; sleep 1; done
          cat /tmp/mysql-start.log; exit 1
      # .cargo/config.toml selects MySQL on port 3307 and fails (never skips) without it.
      - run: cargo nextest run --locked
