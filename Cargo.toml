[package]
name = "rblog"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.rustcms]
version = "0.10.3"

[dependencies]
# MySQL only (no SQLite or PostgreSQL drivers in the binary); `s3` so one binary serves either disk.
rustcms = { git = "https://github.com/irisvn/RustCMS-Core", tag = "v0.10.3", default-features = false, features = ["mysql", "mail", "s3"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "with-chrono", "with-uuid", "with-rust_decimal", "with-json"] }
sea-orm-migration = { version = "=2.0.4", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
# Webhook delivery (services/webhook.rs): rustls only, no system proxy, no native TLS.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
hmac = "0.13"
tokio = { version = "1", features = ["net", "time"] }

[dev-dependencies]
rustcms-testing = { git = "https://github.com/irisvn/RustCMS-Core", tag = "v0.10.3" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
[workspace]

# Builds and links faster: line tables are enough for panics and backtraces in development.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = 0

# Password hashing is far too slow unoptimised, and every sign-in in a test hashes (as RustCMS does).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
