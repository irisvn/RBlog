[package]
name = "rblog"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.rustcms]
version = "0.8.2"

[dependencies]
rustcms = { git = "https://github.com/irisvn/RustCMS-Core", tag = "v0.8.2" }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "with-chrono", "with-uuid", "with-rust_decimal", "with-json"] }
sea-orm-migration = { version = "=2.0.4", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rustcms-testing = { git = "https://github.com/irisvn/RustCMS-Core", tag = "v0.8.2" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
[workspace]

# Builds and links faster: line tables are enough for panics and backtraces in development.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = 0

# Password hashing is far too slow unoptimised, and every sign-in in a test hashes (as RustCMS does).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
